<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>板块雷达 · Sector Radar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📡</span>
      <h1>板块雷达 <small>Sector Radar</small></h1>
    </div>
    <div class="meta">
      <span id="last-update" class="meta-item">加载中…</span>
      <button id="refresh-btn" class="btn-primary" title="刷新所有板块">
        <span class="icon">↻</span> 刷新
      </button>
    </div>
  </header>

  <main>
    <section class="summary" id="summary">
      <!-- 顶部统计条:板块数、个股数、运行状态 -->
    </section>

    <section class="toolbar">
      <input id="search-input" type="search" placeholder="🔍 搜索板块或个股 (如 '医药' / '恒瑞')" />
      <div class="filter-pills">
        <button class="pill active" data-filter="all">全部</button>
        <button class="pill" data-filter="with-news">有新闻</button>
        <button class="pill" data-filter="hot">热门轮动</button>
      </div>
    </section>

    <section class="sectors" id="sectors-grid">
      <div class="loading">加载板块数据中…</div>
    </section>
  </main>

  <div id="news-modal" class="modal hidden">
    <div class="modal-content">
      <header>
        <h2 id="modal-title">板块要闻</h2>
        <button id="modal-close" class="close-btn">×</button>
      </header>
      <div id="modal-body" class="modal-body">加载中…</div>
    </div>
  </div>

  <footer class="footer">
    <span>数据: 东方财富 + 同花顺 | 缓存 5 分钟</span>
    <span class="dot">·</span>
    <span>仅作信息整理,不构成投资建议</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
