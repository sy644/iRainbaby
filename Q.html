<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基金净值实时查询</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.10);
            padding: 32px 30px 40px;
            transition: all 0.2s ease;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .header .icon {
            font-size: 32px;
            line-height: 1;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2634;
            letter-spacing: 0.5px;
        }
        .header .sub {
            margin-left: auto;
            font-size: 13px;
            color: #8c9aa8;
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 30px;
        }

        /* ===== 查询区 ===== */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 12px 18px;
            border: 2px solid #e6eaef;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            background: #fafbfc;
            color: #1a2634;
        }
        .search-box input:focus {
            border-color: #2d7aff;
            box-shadow: 0 0 0 4px rgba(45, 122, 255, 0.12);
            background: #ffffff;
        }
        .search-box input::placeholder {
            color: #b0bcc9;
        }
        .search-box .btn {
            padding: 12px 32px;
            background: #2d7aff;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box .btn:hover {
            background: #1a5fd9;
        }
        .search-box .btn:active {
            transform: scale(0.97);
        }
        .search-box .btn:disabled {
            background: #b0c4dd;
            cursor: not-allowed;
            transform: none;
        }
        .search-box .btn .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 提示消息 ===== */
        .msg {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .msg.show {
            display: flex;
        }
        .msg.error {
            background: #fef0ef;
            color: #c53a2b;
            border: 1px solid #fadad7;
        }
        .msg.success {
            background: #e8f5ed;
            color: #1a7a4a;
            border: 1px solid #c8e6d9;
        }
        .msg.info {
            background: #e8f0fe;
            color: #1a5ba8;
            border: 1px solid #c8d9f0;
        }

        /* ===== 基金信息卡片 ===== */
        .fund-card {
            background: #f8faff;
            border-radius: 18px;
            padding: 22px 24px;
            margin-bottom: 24px;
            border: 1px solid #eef2f8;
            display: none;
        }
        .fund-card.show {
            display: block;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fund-card .row1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 16px;
        }
        .fund-card .row1 .name {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a2b;
        }
        .fund-card .row1 .code {
            font-size: 14px;
            color: #6f7d8d;
            background: #eef2f7;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 500;
        }
        .fund-card .row1 .type {
            font-size: 13px;
            color: #4d6a8f;
            background: #e4ebf5;
            padding: 2px 14px;
            border-radius: 30px;
        }

        .fund-card .row2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px 20px;
            margin-top: 4px;
        }
        .fund-card .row2 .item .label {
            font-size: 13px;
            color: #7a8b9e;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .fund-card .row2 .item .value {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a2b;
            margin-top: 2px;
        }
        .fund-card .row2 .item .value.up {
            color: #d4473a;
        }
        .fund-card .row2 .item .value.down {
            color: #2e9b5c;
        }
        .fund-card .row2 .item .value .sub {
            font-size: 15px;
            font-weight: 400;
            color: #7a8b9e;
            margin-left: 6px;
        }
        .fund-card .row2 .item .date-tag {
            font-size: 13px;
            color: #6f7d8d;
            margin-top: 2px;
        }

        /* ===== 净值表格 ===== */
        .table-wrap {
            border-radius: 16px;
            border: 1px solid #eef2f8;
            overflow: hidden;
            display: none;
            margin-top: 6px;
        }
        .table-wrap.show {
            display: block;
            animation: fadeUp 0.35s ease;
        }
        .table-wrap .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #f8faff;
            border-bottom: 1px solid #eef2f8;
        }
        .table-wrap .table-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a2634;
        }
        .table-wrap .table-header .count {
            font-size: 13px;
            color: #7a8b9e;
        }

        .table-scroll {
            overflow-x: auto;
            padding: 0 4px 4px 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 420px;
        }
        table th {
            background: #f5f8fe;
            color: #3d4e62;
            font-weight: 600;
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e4eaf2;
            font-size: 13px;
        }
        table td {
            padding: 11px 16px;
            text-align: center;
            border-bottom: 1px solid #eff3f9;
            color: #1f2c3d;
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: #f8faff;
        }
        table td.up {
            color: #d4473a;
            font-weight: 600;
        }
        table td.down {
            color: #2e9b5c;
            font-weight: 600;
        }
        table td .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }
        table td .dot.up {
            background: #d4473a;
        }
        table td .dot.down {
            background: #2e9b5c;
        }
        .empty-row td {
            color: #8c9aa8;
            padding: 30px 16px;
            font-style: italic;
        }

        /* ===== 走势图 ===== */
        .chart-wrap {
            margin-top: 24px;
            border-radius: 16px;
            border: 1px solid #eef2f8;
            padding: 16px 16px 10px;
            display: none;
            background: #fafcff;
        }
        .chart-wrap.show {
            display: block;
            animation: fadeUp 0.4s ease;
        }
        .chart-wrap .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .chart-wrap canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #b0bcc9;
            border-top: 1px solid #f0f2f6;
            padding-top: 18px;
        }
        .footer a {
            color: #6f8fc0;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px 28px;
            }
            .header h1 {
                font-size: 20px;
            }
            .search-box input {
                min-width: 140px;
                font-size: 15px;
                padding: 10px 14px;
            }
            .search-box .btn {
                padding: 10px 20px;
                font-size: 15px;
            }
            .fund-card .row2 .item .value {
                font-size: 19px;
            }
            .fund-card .row1 .name {
                font-size: 18px;
            }
            table {
                font-size: 13px;
                min-width: 360px;
            }
            table th,
            table td {
                padding: 9px 10px;
            }
        }
        @media (max-width: 420px) {
            .search-box {
                flex-direction: column;
            }
            .search-box input {
                min-width: 100%;
            }
            .fund-card .row2 {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <span class="icon">📈</span>
            <h1>基金净值查询</h1>
            <span class="sub">实时数据</span>
        </div>

        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="fundCodeInput" placeholder="输入基金代码，如 001186" maxlength="10" autofocus />
            <button class="btn" id="queryBtn">
                <span id="btnText">🔍 查询</span>
                <span class="spinner" id="btnSpinner" style="display:none;"></span>
            </button>
        </div>

        <!-- 消息 -->
        <div class="msg" id="msg"></div>

        <!-- 基金信息卡片 -->
        <div class="fund-card" id="fundCard">
            <div class="row1">
                <span class="name" id="fundName">--</span>
                <span class="code" id="fundCodeDisplay">--</span>
                <span class="type" id="fundType">--</span>
            </div>
            <div class="row2">
                <div class="item">
                    <div class="label">最新净值</div>
                    <div class="value" id="netWorth">--</div>
                    <div class="date-tag" id="netDate">--</div>
                </div>
                <div class="item">
                    <div class="label">累计净值</div>
                    <div class="value" id="accWorth">--</div>
                    <div class="date-tag" id="accDate">--</div>
                </div>
                <div class="item">
                    <div class="label">日涨跌幅</div>
                    <div class="value" id="changeRate">--</div>
                    <div class="date-tag">近一日</div>
                </div>
                <div class="item">
                    <div class="label">单位净值</div>
                    <div class="value" id="unitWorth">--</div>
                    <div class="date-tag">最新</div>
                </div>
            </div>
        </div>

        <!-- 历史净值表格 -->
        <div class="table-wrap" id="tableWrap">
            <div class="table-header">
                <h3>📋 历史净值</h3>
                <span class="count" id="recordCount">共 0 条</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>单位净值</th>
                            <th>累计净值</th>
                            <th>日涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr class="empty-row">
                            <td colspan="4">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 走势图 -->
        <div class="chart-wrap" id="chartWrap">
            <div class="chart-title">📊 净值走势（近10期）</div>
            <canvas id="chartCanvas" height="220"></canvas>
        </div>

        <div class="footer">
            数据来源：天天基金网 · 仅供学习参考
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const input = document.getElementById('fundCodeInput');
            const queryBtn = document.getElementById('queryBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const msg = document.getElementById('msg');
            const fundCard = document.getElementById('fundCard');
            const fundName = document.getElementById('fundName');
            const fundCodeDisplay = document.getElementById('fundCodeDisplay');
            const fundType = document.getElementById('fundType');
            const netWorth = document.getElementById('netWorth');
            const netDate = document.getElementById('netDate');
            const accWorth = document.getElementById('accWorth');
            const accDate = document.getElementById('accDate');
            const changeRate = document.getElementById('changeRate');
            const unitWorth = document.getElementById('unitWorth');
            const tableWrap = document.getElementById('tableWrap');
            const historyBody = document.getElementById('historyBody');
            const recordCount = document.getElementById('recordCount');
            const chartWrap = document.getElementById('chartWrap');
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');

            // ===== 状态 =====
            let isLoading = false;
            let currentCode = '';

            // ===== 工具：显示消息 =====
            function showMessage(text, type) {
                msg.textContent = text;
                msg.className = 'msg show ' + (type || 'info');
                // 自动隐藏（非错误）
                if (type !== 'error') {
                    clearTimeout(msg._hideTimer);
                    msg._hideTimer = setTimeout(() => {
                        msg.className = 'msg';
                    }, 5000);
                }
            }

            function hideMessage() {
                msg.className = 'msg';
                clearTimeout(msg._hideTimer);
            }

            // ===== 工具：格式化数字 =====
            function fmtNum(v, digits) {
                if (v === undefined || v === null || isNaN(v)) return '--';
                return Number(v).toFixed(digits || 4);
            }

            function fmtPercent(v) {
                if (v === undefined || v === null || isNaN(v)) return '--';
                const val = Number(v);
                const sign = val > 0 ? '+' : '';
                return sign + val.toFixed(2) + '%';
            }

            // ===== 工具：适配 Canvas =====
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const w = rect.width || canvas.parentElement.clientWidth - 32;
                canvas.width = w * dpr;
                canvas.height = 220 * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = '220px';
                ctx.scale(dpr, dpr);
                return w;
            }

            // ===== 绘制走势图 =====
            function drawChart(data) {
                if (!data || data.length < 2) {
                    chartWrap.classList.remove('show');
                    return;
                }
                chartWrap.classList.add('show');

                const w = canvas.parentElement.clientWidth - 32;
                const h = 200;
                canvas.width = w * (window.devicePixelRatio || 1);
                canvas.height = h * (window.devicePixelRatio || 1);
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

                const padding = { top: 16, bottom: 28, left: 12, right: 12 };
                const chartW = w - padding.left - padding.right;
                const chartH = h - padding.top - padding.bottom;

                // 提取净值数据（单位净值）
                const values = data.map(d => d.netWorth);
                const minVal = Math.min(...values) * 0.998;
                const maxVal = Math.max(...values) * 1.002;
                const range = maxVal - minVal || 0.001;

                // 清空
                ctx.clearRect(0, 0, w, h);

                // 绘制网格线（浅灰）
                ctx.strokeStyle = '#eef2f8';
                ctx.lineWidth = 0.8;
                for (let i = 0; i <= 4; i++) {
                    const y = padding.top + (chartH / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(w - padding.right, y);
                    ctx.stroke();
                }

                // 绘制折线
                const stepX = chartW / (data.length - 1);
                const points = data.map((d, i) => {
                    const x = padding.left + i * stepX;
                    const y = padding.top + chartH - ((d.netWorth - minVal) / range) * chartH;
                    return { x, y, val: d.netWorth };
                });

                // 渐变填充
                const grad = ctx.createLinearGradient(0, padding.top, 0, h - padding.bottom);
                grad.addColorStop(0, 'rgba(45, 122, 255, 0.20)');
                grad.addColorStop(1, 'rgba(45, 122, 255, 0.01)');
                ctx.beginPath();
                ctx.moveTo(points[0].x, padding.top + chartH);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(points[points.length
